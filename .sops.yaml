keys:
  - &ngarvey age1nyxjtps38j4p52nmwtf96h7d9mege90ftf4xcpxppctcwq5huqys4hy5k0
  - &workstation age1le67uqtvry52ch733vytmr7yjvjsna8u3k6a9n285ggmuzfv9q7s4rqufu
  - &wabbajack age1phmmhj7kfedel0uz052sj8glcevj6qgh5sdmq73ctm8qqlnxaarq4l9rvv
  - &dovahkiin age1m9l2ncrkg5zelkegwpa2ux2kw5cljay2m9sxuzf2eyz8qqje45vsmfn76k
  - &dragonsreach age1c3fwgyf6tm44gzhyvfjk5eyysef0shufd50kdg4t0w2rd9jylcusakgxpy
  - &lydia age1cz96x8w6653wruqxrwquczv3ulwe5gfnvyy6p3tzvs8mehc7gyas7hty0k
  - &skyforge age1z95v2ahfghn34yg2yl8k3crtqtraqg6mnvvzq2audzr96savcqxs5p7yfe
  # fus/ro/dah/joor/zah/frul: derived with ssh-to-age from each host's
  # /etc/ssh/ssh_host_ed25519_key.pub. sops-nix reads that key by default
  # (sops.age.sshKeyPaths), so nothing is placed on the machine by hand.
  - &fus age1vw4e5v6qlm3gac9v3l33qkakprfnwn5mr4vq2pa5z4s7h2llvpsspw927q
  - &ro age17gc0nufm6gwnshlg7fuytdj9hmy27y06rzq8hcr6tv764hfccavswdek5r
  - &dah age1nu0ltg42na0x2fmr4lq7rh6a7xwwpgyjnk4ey0cjm60g0ej2w9wsrc7yfl
  - &joor age1dyx6ej446fhg7zgvs9ldjqcg77dxldd9mj3q3klxvfsg8mr54fwsd3nuuk
  - &zah age1zecjn7d4f364fku7n6s7mktwzpklqt0u0an0edjykmg59sgj743q8fvmkx
  - &frul age1a230t20a7jl2ce5w9axz8caajgk2s4w6ry2cvy52l2vupf685ujsrhfsdl
creation_rules:
  - path_regex: secrets/frigate.yaml
    key_groups:
    - age:
      - *ngarvey
      - *lydia
  - path_regex: secrets/garage.yaml
    key_groups:
    - age:
      - *ngarvey
      - *lydia
      - *wabbajack
      - *workstation
  # garage-acme: the TSIG key for the garage nodes' DNS-01 challenges.
  #   - dragonsreach serves the zone, so knot-auth needs the same key to
  #     validate the updates (modules/containers/knot-auth.nix).
  #   - lydia + wabbajack run lego. Every garage node holds this key; the Knot
  #     ACL is scoped to the one owner name they all write, not to a host, so
  #     adding a node is just another recipient here.
  - path_regex: secrets/garage-acme.yaml
    key_groups:
    - age:
      - *ngarvey
      - *dragonsreach
      - *lydia
      - *wabbajack
  # rgw-acme: TSIG secret for the acme-rgw key (ACME DNS-01 for
  # rgw.home.garvey.sh). dragonsreach holds it for Knot; each Ceph node runs
  # lego for its own copy of the certificate (modules/services/ceph.nix).
  - path_regex: secrets/rgw-acme.yaml
    key_groups:
    - age:
      - *ngarvey
      - *dragonsreach
      - *joor
      - *zah
      - *frul
  # llm-models: dedicated garage S3 key for the LLM model store.
  #   - dovahkiin + wabbajack present their own host keys; dovahkiin runs the
  #     hf-to-garage upload tool, wabbajack retains access from when it did.
  #   - `workstation` is the identity talos presents (same one that decrypts
  #     garage.yaml); it stays so a host running the vLLM module
  #     (modules/llms/vllm.nix) can read the key.
  # ngarvey is included so the secret can be edited.
  - path_regex: secrets/llm-models.yaml
    key_groups:
    - age:
      - *ngarvey
      - *workstation
      - *dovahkiin
      - *wabbajack
  - path_regex: secrets/dragonsreach.yaml
    key_groups:
    - age:
      - *ngarvey
      - *dragonsreach
  - path_regex: secrets/k3s.yaml
    key_groups:
    - age:
      - *ngarvey
      - *fus
      - *ro
      - *dah
      - *joor
      - *zah
      - *frul
  # ceph-admin: a recovery copy of the Ceph client.admin keyring. Only ngarvey
  # can decrypt it; no host needs it, since each storage node keeps its own
  # /etc/ceph/ceph.client.admin.keyring. With any one mon still up, this key is
  # enough to administer the cluster and re-issue every other key.
  - path_regex: secrets/ceph-admin.yaml
    key_groups:
    - age:
      - *ngarvey
  # ceph-backup: the Garage key for the `ceph-backup` bucket and the Kopia
  # repository password. joor runs the backups (modules/services/ceph-backup.nix);
  # ngarvey is here so the backups can be restored from any machine if joor is
  # gone: without the password the repository is unreadable.
  - path_regex: secrets/ceph-backup.yaml
    key_groups:
    - age:
      - *ngarvey
      - *joor
  # llm-api-keys: the hosted-LLM API keys pi uses. `workstation` is the identity
  # both workstations present, so one recipient covers talos and dovahkiin.
  - path_regex: secrets/llm-api-keys.yaml
    key_groups:
    - age:
      - *ngarvey
      - *workstation
  # zot-push: the `auth` value (base64 of user:password) for pushing to the
  # oci.garvey.sh registry. `workstation` lets talos and dovahkiin install it as
  # ~/.config/containers/auth.json (modules/desktop/zot-push.nix). zot itself
  # holds only the bcrypt hash (k8s-gitops manifests/zot/secret.yaml).
  - path_regex: secrets/zot-push.yaml
    key_groups:
    - age:
      - *ngarvey
      - *workstation
  - path_regex: secrets/smb-credentials.yaml
    key_groups:
    - age:
      - *ngarvey
      - *workstation
      - *wabbajack
      - *dovahkiin
      - *lydia
  - path_regex: secrets/storj-gateway.yaml
    key_groups:
    - age:
      - *ngarvey
      - *dragonsreach
